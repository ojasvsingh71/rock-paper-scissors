<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock_paper_scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">rock paper scissor</div>
    <button id="rock" class="btns"></button>
    <button id="paper" class="btns"></button>
    <button id="scissor" class="btns"></button>
    <div class="score">
        <div id="userptn">0</div>
        <div id="comptn">0</div>
        <div id="usermsg">user</div>
        <div id="commsg">computer</div>
    </div>
    <div class="msg"></div>
    <button class="reset">reset</button>
    <script src="script.js"></script>
</body>
</html>
